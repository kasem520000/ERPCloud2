# مساحة الاسم وحدود الموارد الافتراضية لكل ما يُنشر فيها.
apiVersion: v1
kind: Namespace
metadata:
  name: erp
  labels:
    app.kubernetes.io/part-of: erp
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: erp-quota
  namespace: erp
spec:
  hard:
    requests.cpu: '8'
    requests.memory: 16Gi
    limits.cpu: '16'
    limits.memory: 32Gi
    persistentvolumeclaims: '4'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: erp-defaults
  namespace: erp
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
