# نموذج السرّ — **لا تُودِعه بقيمٍ حقيقية**. أنشِئه بالأمر:
#   kubectl -n erp create secret generic erp-secrets \
#     --from-literal=POSTGRES_PASSWORD='…' \
#     --from-literal=DATABASE_URL='postgres://erp_api:…@erp-postgres:5432/app' \
#     --from-literal=DATABASE_MIGRATOR_URL='postgres://postgres:…@erp-postgres:5432/app' \
#     --from-literal=JWT_PRIVATE_KEY="$(cat deploy/jwt-private.pem)" \
#     --from-literal=JWT_PUBLIC_KEY="$(cat deploy/jwt-public.pem)" \
#     --from-literal=DATA_ENC_KEY='…' --from-literal=FILE_URL_SIGNING_SECRET='…'
apiVersion: v1
kind: Secret
metadata:
  name: erp-secrets
  namespace: erp
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgres://erp_api:change-me@erp-postgres:5432/app
  DATABASE_MIGRATOR_URL: postgres://postgres:change-me@erp-postgres:5432/app
  JWT_KEY_ID: 'key-1'
  JWT_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    …
    -----END PRIVATE KEY-----
  JWT_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    …
    -----END PUBLIC KEY-----
  DATA_ENC_KEY: ''
  FILE_URL_SIGNING_SECRET: ''
  PLATFORM_ADMIN_PASSWORD: ''
  STRIPE_SECRET_KEY: ''
  STRIPE_WEBHOOK_SECRET: ''
