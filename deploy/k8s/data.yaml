# ---------------------------------------------------------------------------
# البيانات: PostgreSQL (StatefulSet + خدمة رأسية) و Redis و MailHog.
# في الإنتاج الجدّي: PostgreSQL مُدار (RDS/Cloud SQL) بدل هذا — والحقول نفسها في السرّ.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: erp-postgres
  namespace: erp
spec:
  serviceName: erp-postgres
  replicas: 1
  selector:
    matchLabels: { app: erp-postgres }
  template:
    metadata:
      labels: { app: erp-postgres }
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16
          ports: [{ containerPort: 5432, name: pg }]
          env:
            - { name: POSTGRES_DB, value: app }
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: erp-secrets, key: POSTGRES_PASSWORD } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ['pg_isready', '-U', 'postgres', '-d', 'app'] }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec: { command: ['pg_isready', '-U', 'postgres'] }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: '2', memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ['ReadWriteOnce']
        resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: erp-postgres
  namespace: erp
spec:
  clusterIP: None
  selector: { app: erp-postgres }
  ports: [{ port: 5432, targetPort: 5432, name: pg }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-redis
  namespace: erp
spec:
  replicas: 1
  selector:
    matchLabels: { app: erp-redis }
  template:
    metadata:
      labels: { app: erp-redis }
    spec:
      containers:
        - name: redis
          image: redis:7
          args: ['redis-server', '--appendonly', 'yes']
          ports: [{ containerPort: 6379, name: redis }]
          readinessProbe:
            exec: { command: ['redis-cli', 'ping'] }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}   # للطوابير والجلسات القصيرة؛ لا بياناتٌ لا تُستعاد
---
apiVersion: v1
kind: Service
metadata:
  name: erp-redis
  namespace: erp
spec:
  selector: { app: erp-redis }
  ports: [{ port: 6379, targetPort: 6379, name: redis }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-mailhog
  namespace: erp
spec:
  replicas: 1
  selector:
    matchLabels: { app: erp-mailhog }
  template:
    metadata:
      labels: { app: erp-mailhog }
    spec:
      containers:
        - name: mailhog
          image: mailhog/mailhog:v1.0.1
          ports:
            - { containerPort: 1025, name: smtp }
            - { containerPort: 8025, name: http }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: erp-mailhog
  namespace: erp
spec:
  selector: { app: erp-mailhog }
  ports:
    - { port: 1025, targetPort: 1025, name: smtp }
    - { port: 8025, targetPort: 8025, name: http }
---
# لا يُقبل اتصالٌ بقاعدة البيانات إلا من وحدات هذه المساحة.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: erp-postgres-ingress
  namespace: erp
spec:
  podSelector:
    matchLabels: { app: erp-postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/part-of: erp } }
      ports: [{ port: 5432, protocol: TCP }]
